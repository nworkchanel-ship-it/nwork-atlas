<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>NWORK Open</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f1115; color:#e5e7eb; font:15px -apple-system,BlinkMacSystemFont,sans-serif; }
</style>
</head>
<body>
<div id="m">Открываю…</div>
<script>
(function () {
  var h = (location.hash || "").replace(/^#/, "");
  var idx = h.indexOf("=");
  if (idx < 1) { document.getElementById("m").textContent = "Путь не передан"; return; }
  var act = h.slice(0, idx);
  var raw = h.slice(idx + 1);
  if (act !== "open" && act !== "reveal") { document.getElementById("m").textContent = "Неизвестное действие"; return; }
  location.replace("http://127.0.0.1:18765/" + act + "?path=" + raw);
})();
</script>
</body>
</html>
